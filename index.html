<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>뽀모도로 타이머</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="pomodoro-container">
        <h1 id="mode-text">집중 시간</h1>
        <div class="timer-display" id="time-display">25:00</div>

        <div class="controls">
            <button id="start-btn" class="btn btn-primary">시작</button>
            <button id="pause-btn" class="btn">일시정지</button>
            <button id="reset-btn" class="btn btn-danger">초기화</button>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>

</html>
